<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Univers Parallele">
  <!-- Réduction au signe : le globe et ses lunettes en aplats.
       Le trait fin de la mascotte disparaît sous 32 px, ces masses tiennent à 16. -->
  <rect width="64" height="64" fill="#16150F"/>
  <circle cx="32" cy="33" r="23" fill="#EDE9E3"/>
  <g fill="#16150F">
    <!-- parallèles -->
    <path d="M11.5 25.5h41v3.4h-41z"/>
    <path d="M11.5 41h41v3.4h-41z"/>
    <!-- méridien -->
    <path d="M30.3 10.6h3.4v45h-3.4z"/>
    <!-- lunettes, le trait le plus reconnaissable -->
    <path d="M9 30.5h46v9.2H9z"/>
  </g>
  <g fill="#EDE9E3">
    <path d="M27.5 31.7h3.2l-3.4 6.8h-3.2z"/>
    <path d="M34 31.7h3.2l-3.4 6.8h-3.2z"/>
  </g>
</svg>

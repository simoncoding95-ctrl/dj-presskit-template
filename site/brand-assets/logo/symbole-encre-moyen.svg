<svg xmlns="http://www.w3.org/2000/svg" viewBox="-392 -262 784 524" width="784" height="524" role="img" aria-label="Univers Parallele">
<style>.upma-anneau{transform-box:view-box;transform-origin:0px 0px;animation:upma-oscille 9s cubic-bezier(.645,.045,.355,1) infinite alternate}@keyframes upma-oscille{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}.upma-noyau{transform-box:view-box;transform-origin:0px 0px;animation-iteration-count:infinite;animation-name:upma-noyau;animation-duration:4.0s;animation-timing-function:cubic-bezier(.23,1,.32,1)}@keyframes upma-noyau{0%{transform:scale(1)}5%{transform:scale(2.4)}26%{transform:scale(1)}100%{transform:scale(1)}}.upma-eclat{transform-box:view-box;transform-origin:0px 0px;animation-iteration-count:infinite;opacity:0;animation-name:upma-eclat;animation-duration:4.0s;animation-timing-function:cubic-bezier(.23,1,.32,1)}@keyframes upma-eclat{0%{transform:scale(.3);opacity:0}2%{opacity:1}24%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}.upma-onde{transform-box:view-box;transform-origin:0px 0px;animation-iteration-count:infinite;opacity:0;animation-name:upma-onde;animation-duration:4.0s;animation-timing-function:cubic-bezier(.33,1,.68,1)}.upma-onde0{animation-delay:0s}.upma-onde1{animation-delay:0.32s}.upma-onde2{animation-delay:0.7s}.upma-onde{stroke-width:1.2px}.upma-onde0{stroke-width:2px}.upma-eclat{stroke-width:1.4px}@keyframes upma-onde{0%{transform:scale(.07);opacity:0}3%{opacity:1}40%{opacity:.55}66%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){.upma-anneau,.upma-onde,.upma-noyau,.upma-eclat{animation:none}.upma-onde,.upma-eclat{opacity:0}}</style><defs><clipPath id="upma-avant"><rect x="-500" y="0" width="1000" height="300"/></clipPath><clipPath id="upma-disque"><circle r="235.0"/></clipPath><clipPath id="upma-arriere"><rect x="-500" y="-300" width="1000" height="300"/></clipPath><mask id="upma-hors-disque" maskUnits="userSpaceOnUse" x="-600" y="-600" width="1200" height="1200"><rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/><circle r="245.0" fill="#000"/></mask><mask id="upma-sous-anneau" maskUnits="userSpaceOnUse" x="-600" y="-600" width="1200" height="1200"><rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/><g class="upma-anneau"><g transform="rotate(-33.8)"><g clip-path="url(#upma-avant)"><path d="M-372 0 A372 100 0 1 0 372 0 A372 100 0 1 0 -372 0Z M-279 0 A279 75 0 1 0 279 0 A279 75 0 1 0 -279 0Z" fill="#000" fill-rule="evenodd" stroke="#000" stroke-width="22.0"/></g></g></g></mask></defs><g fill="none" stroke="#1A1917" stroke-width="10"><g mask="url(#upma-sous-anneau)"><circle r="235"/><circle r="185"/><circle r="146"/><circle r="82"/><circle class="upma-noyau" r="16"/><g clip-path="url(#upma-disque)"><circle class="upma-onde upma-onde0" r="225.0" vector-effect="non-scaling-stroke"/><circle class="upma-onde upma-onde1" r="225.0" vector-effect="non-scaling-stroke"/><circle class="upma-onde upma-onde2" r="225.0" vector-effect="non-scaling-stroke"/><path class="upma-eclat" d="M26.8 4.7L81.9 14.4M23.6 13.6L43.0 24.8M17.5 20.8L43.2 51.5M9.3 25.6L14.2 39.1M0.0 27.2L0.0 96.0M-9.3 25.6L-19.7 54.1M-17.5 20.8L-53.5 63.7M-23.6 13.6L-43.0 24.8M-26.8 4.7L-66.2 11.7M-26.8 -4.7L-41.0 -7.2M-23.6 -13.6L-83.1 -48.0M-17.5 -20.8L-37.0 -44.1M-9.3 -25.6L-28.5 -78.2M-0.0 -27.2L-0.0 -49.6M9.3 -25.6L23.0 -63.1M17.5 -20.8L26.7 -31.9M23.6 -13.6L83.1 -48.0M26.8 -4.7L56.7 -10.0" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g></g><g mask="url(#upma-hors-disque)"><g class="upma-anneau"><g transform="rotate(-33.8)"><g clip-path="url(#upma-arriere)"><path d="M-372 0 A372 100 0 1 0 372 0 A372 100 0 1 0 -372 0Z"/><path d="M-279 0 A279 75 0 1 0 279 0 A279 75 0 1 0 -279 0Z"/></g></g></g></g><g class="upma-anneau"><g transform="rotate(-33.8)"><g clip-path="url(#upma-avant)"><path d="M-372 0 A372 100 0 1 0 372 0 A372 100 0 1 0 -372 0Z"/><path d="M-279 0 A279 75 0 1 0 279 0 A279 75 0 1 0 -279 0Z"/></g></g></g></g>
